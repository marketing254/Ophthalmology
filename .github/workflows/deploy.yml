name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Site is served at https://<user>.github.io/Ophthalmology/
      NEXT_PUBLIC_BASE_PATH: /Ophthalmology
      # Apps Script endpoint (public by design — it ships to the browser).
      NEXT_PUBLIC_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbyjld0QAIsk2xvc5xWoVeEbBzoCC5VnELzK_hzpqajONnGLIXWqWOdZ7Y2ifsTmR6i1JA/exec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
